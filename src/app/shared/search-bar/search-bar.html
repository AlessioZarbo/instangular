<section class="search-panel" aria-labelledby="search-title">
	<div class="search-panel__intro">
		<p class="search-panel__eyebrow">Scopri qualcosa di nuovo</p>
		<h1 id="search-title">Cosa stai cercando?</h1>
	</div>

	<form class="search-form" role="search">
		<label class="search-form__field">
			<span class="search-form__icon" aria-hidden="true"></span>
			<span class="visually-hidden">Cerca contenuti</span>
			<input type="search" placeholder="Cerca post, persone o argomenti" readonly />
		</label>
		<button class="search-form__button" type="button" aria-label="Avvia ricerca" title="Avvia ricerca">
			<span class="search-form__arrow" aria-hidden="true"></span>
		</button>
	</form>

	<div class="search-panel__meta">
		<span class="search-panel__label">Esplora per tema</span>
		<div class="search-panel__tags" aria-label="Argomenti popolari">
			<button type="button" class="tag tag--active">Design</button>
			<button type="button" class="tag">Fotografia</button>
			<button type="button" class="tag">Tecnologia</button>
			<button type="button" class="tag">Viaggi</button>
		</div>
	</div>
</section>
